name: Build the app

# Builds a ready-to-run app for Windows, macOS and Linux on GitHub's own
# machines. Nobody needs Python: not the people who use the app, and not the
# person releasing it. PyInstaller cannot cross-compile, which is the only
# reason this has to run three times.
#
#   Actions -> Build the app -> Run workflow      builds and attaches the zips
#   git tag v0.2.0 && git push --tags             the same, plus a Release
#
# This file is orchestration only. Everything platform-specific lives in
# packaging/ci/, because changing a file under .github/workflows/ needs a token
# scope that ordinary pushes do not have, and a Windows fix should not be
# gated on that. See packaging/ci/README.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# The action versions below are the first of each that run on Node.js 24.
# GitHub deprecated Node.js 20 and was already forcing these onto 24, which is
# what the warning in every build was about. Each bump is a runtime change only:
# no input, output or behaviour changed, which is why several majors were
# crossed at once without touching anything else.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: qalun-windows
          - os: macos-latest
            label: macOS
            artifact: qalun-macos
          - os: ubuntu-latest
            label: Linux
            artifact: qalun-linux

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app and the builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Get FriBiDi (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-fribidi

      - name: Collect what the app needs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs['msys2-location'] }}
        run: packaging/ci/collect-windows.ps1

      - name: Collect what the app needs (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/ci/collect-macos.sh

      - name: Collect what the app needs (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/ci/collect-linux.sh

      - name: Build
        run: pyinstaller packaging/qalun.spec --noconfirm

      - name: Put them beside the app
        shell: bash
        run: bash packaging/ci/stage.sh

      # The speech model the gate's transcription downloads, kept between runs.
      # Every download from the qalun-models release counts towards its download
      # numbers, which is how installs are counted, so CI should not add one per
      # build. check-transcription.sh points the app at this folder on Actions.
      # The key is the archive's pinned sha256 in model_store.py; a test fails if
      # the two disagree. GitHub evicts a cache unused for 7 days, so a miss still
      # downloads once per platform.
      - name: Keep the speech model between runs
        uses: actions/cache@v5
        with:
          path: .ci-cache/qalun/models
          key: qalun-model-${{ runner.os }}-bc9956a0f6485a797545b1240d63c43fb05f92a5c1ce0d5fb9818f31a4592d01

      # The gate. An app that cannot shape Arabic is not worth shipping, and
      # this finds out on the platform it matters on rather than by inference
      # from a Linux build.
      - name: Check the built app can render (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash packaging/ci/check.sh

      - name: Check the built app can render (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/ci/check.ps1

      - name: Package
        shell: bash
        run: bash packaging/ci/package.sh ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: out/*.zip
          retention-days: 30

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          # Until the release checklist's blockers are settled (and the app is 1.0),
          # a release is a pre-release: never shown as the repository's latest.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: artifacts/**/*.zip
          body: |
            Download the file for your system, unzip it, and run **Qalun**.
            Nothing else to install.

            - `qalun-windows.zip` — unzip, open the folder, run `qalun.exe`.
              Windows will warn that the publisher is unknown because the app is
              not code-signed yet: choose **More info → Run anyway**.
            - `qalun-macos.zip` — unzip and drag **Qalun** to Applications.
              macOS will refuse it the first time because it is not notarized
              yet: right-click it and choose **Open**.
            - `qalun-linux.zip` — unzip and run `qalun`.

            If it will not render, run `qalun --doctor`. It prints what is wrong
            and saves a copy of the report next to the app's data folder; send
            that file.
