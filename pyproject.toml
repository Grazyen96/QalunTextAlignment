[build-system]
# 77 is the first that reads an SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qurantext"
# The version is written in one place, src/qurantext/__init__.py; a tag build
# fails unless the tag is v<that version> (packaging/ci/package.sh).
dynamic = ["version"]
description = "Quran alignment, matching, transcription, and rendering workflows."
readme = "README.md"
# GPL-3.0 because the bundled sherpa-onnx links espeak-ng (GPL-3.0) into the app's
# process. See THIRD_PARTY_NOTICES.md and the "Licence finding" in docs/findings/asr-bakeoff.md.
# Not covered: the package data's Quran font (assets/fonts/qaloon.10.ttf and
# qaloon.10.woff2) and Quran text (assets/quran/UthmanicQaloon1-v10.txt) are
# third-party works, their provenance and terms to be confirmed by the owner; see
# src/qurantext/assets/README.md and THIRD_PARTY_NOTICES.md. Nor is the title font,
# Amiri (assets/fonts/Amiri-Regular.ttf and Amiri-Bold.ttf), which stays under the SIL
# Open Font License 1.1, its text beside it (Amiri-OFL.txt), nor the interface's Arabic
# fallback, Noto Sans Arabic (assets/fonts/NotoSansArabic-Regular.ttf and
# NotoSansArabic-Bold.ttf), also under the SIL Open Font License 1.1, its text beside it
# (NotoSansArabic-OFL.txt), nor the Lucide interface icons (assets/icons/), under the
# ISC License and, for those derived from Feather, the MIT License, both in
# assets/icons/LICENSE. The app icon (assets/icon/) is the project's own work, under
# the project's licence.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  # The frame renderer requires a Pillow build compiled with libraqm for
  # correct Arabic shaping/RTL (checked at runtime via features.check("raqm")).
  "Pillow>=10.0,<13",
  "replicate>=1.0,<2",
  # Trusted certificates for the speech model's download: a frozen app cannot rely on the system's.
  "certifi>=2023",
  # The local transcription engine (NVIDIA FastConformer Arabic through ONNX).
  # Pinned exactly to the release the parity gate passed with
  # (docs/findings/asr-bakeoff.md). THIRD_PARTY_NOTICES.md, packaging/licenses/ and
  # packaging/third-party-sources.txt describe this very build, so moving the pin
  # means updating them; tests/test_packaging_spec.py fails until they agree.
  "sherpa-onnx==1.13.8",
  # The generated outro's QR code (BSD 3-Clause, pure Python). Pinned exactly:
  # packaging/licenses/segno-LICENSE.txt is this release's licence, and
  # tests/test_packaging_spec.py fails until the pin, the install and it agree.
  "segno==1.6.6",
  # The outro link's international host names, IDNA 2008 with UTS #46 as browsers
  # use (BSD 3-Clause, pure Python); Python's own codec is IDNA 2003. Pinned
  # exactly, like segno; the notice credits it in its own right.
  "idna==3.13",
]

[project.optional-dependencies]
# The window. Optional so the command line installs without a ~150 MB Qt.
gui = [
  "PySide6-Essentials>=6.6,<7",
  # Carries Qt Multimedia, which the review window's playback uses. Optional:
  # the app still runs without it, just with playback disabled and a reason shown.
  "PySide6-Addons>=6.6,<7",
]
dev = [
  "pytest>=8,<10",
  # Pinned exactly: CI runs `ruff format --check`, and the formatter's output
  # changes between releases, so an open range turns the build red on its own.
  "ruff==0.15.13",
]

[project.scripts]
qurantext = "qurantext.cli.main:main"
qalun = "qurantext.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "qurantext.__version__"}

# The renderer's default font must travel with the wheel. Without this the wheel
# is Python files only, and the font path resolves into the Python installation.
[tool.setuptools.package-data]
qurantext = ["assets/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A test running past two minutes dumps every thread's stack, so a hang explains itself.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py310"
# Throwaway experiments kept for their written result, not their code. They need
# dependencies the package does not have (torch, transformers), so CI neither
# installs nor runs them. See prototypes/README.md.
exclude = ["prototypes"]

[tool.ruff.lint]
# PLE2502: no literal direction marks in source; the Arabic table writes them as
# \u escapes so a reviewer can see them (and cannot be misled by them).
select = ["B", "E", "F", "I", "UP", "PLE2502"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy root/`scripts/` compatibility shims intentionally adjust sys.path
# before importing the package, which trips E402 (import not at top of file).
"detect_range.py" = ["E402"]
"render_ayat_video.py" = ["E402"]
"lecture_mode.py" = ["E402"]
"whisperx_service.py" = ["E402"]
"env_utils.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"