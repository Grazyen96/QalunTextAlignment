<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: #d6d6d6;
      background: #232323;
      margin: 0;
      padding: 12px;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      background: #3a3a3a;
      color: #e8e8e8;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    #spec-summary {
      margin: 8px 0;
      padding: 8px;
      background: #2c2c2c;
      border-radius: 4px;
      white-space: pre-wrap;
    }
    #log {
      margin-top: 10px;
      padding: 8px;
      height: 260px;
      overflow-y: auto;
      background: #1b1b1b;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
    .warn { color: #e0b45c; }
    .error { color: #e06c6c; }
    .ok { color: #7fc97f; }
  </style>
</head>
<body>
  <h1>Qalun Edit-Spec Builder</h1>
  <button id="btn-load">1 · Load edit_spec.json…</button>
  <div id="spec-summary">No spec loaded.</div>
  <button id="btn-build" disabled>2 · Build sequence in this project</button>
  <button id="btn-save" disabled>3 · Save project.prproj into package</button>
  <button id="btn-export" disabled>4 · Export MP4 (Adobe Media Encoder)</button>
  <div id="log"></div>
  <script src="src/main.js"></script>
</body>
</html>
